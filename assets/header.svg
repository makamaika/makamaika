<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="hdr-title hdr-desc">
  <title id="hdr-title">maka (@makamaika)</title>
  <desc id="hdr-desc">夜の水辺に線香花火と波紋が浮かぶ、maka のプロフィールヘッダー</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.6" stop-color="#0c1224"/>
      <stop offset="1" stop-color="#141b38"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1022" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#05070f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff7a3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect x="1040" y="20" width="120" height="120" fill="#000"/>
      <circle cx="1100" cy="74" r="26" fill="#fff"/>
      <circle cx="1112" cy="66" r="23" fill="#000"/>
    </mask>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .star { fill: #e2e8f0; animation: twinkle 4.5s ease-in-out infinite; }
    .ripple {
      fill: none; stroke: #7dd3fc; stroke-width: 1.3; opacity: 0;
      transform-box: fill-box; transform-origin: center;
      animation: ripple 6s ease-out infinite;
    }
    .ripple.warm { stroke: #ffb454; }
    .ripple.violet { stroke: #a78bfa; }
    .spark {
      fill: none; stroke: #ffd9a0; stroke-width: 1.5; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
      animation: spark 2.6s ease-out infinite;
    }
    .ember { animation: flicker 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .glow { animation: breathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .reflection { animation: flicker 2.3s ease-in-out infinite; }
    .label { font: 600 14px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 6px; fill: #7dd3fc; }
    .name  { font: 800 96px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 1px; fill: url(#name); }
    .meta  { font: 500 19px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; fill: #8b97b5; }
    .tag   { font: 500 22px "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif; fill: #d5dbee; }

    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
    @keyframes ripple  { 0% { transform: scale(0.08); opacity: 0; } 14% { opacity: 0.6; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes spark   { 0% { stroke-dashoffset: 1; opacity: 0; } 8% { opacity: 1; } 38% { stroke-dashoffset: 0; opacity: 1; } 62%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes flicker { 0%, 100% { opacity: 0.85; transform: scale(1); } 30% { opacity: 1; transform: scale(1.12); } 60% { opacity: 0.7; transform: scale(0.94); } }
    @keyframes breathe { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }

    @media (prefers-reduced-motion: reduce) {
      .star, .ripple, .spark, .ember, .glow, .reflection { animation: none; }
      .star { opacity: 0.7; }
      .ripple { opacity: 0.3; }
      .spark { stroke-dashoffset: 0; opacity: 0.9; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- 星 -->
    <g>
      <circle class="star" cx="52" cy="38" r="1.2" style="animation-delay:-0.4s"/>
      <circle class="star" cx="138" cy="96" r="0.9" style="animation-delay:-2.1s"/>
      <circle class="star" cx="214" cy="30" r="1.4" style="animation-delay:-3.3s"/>
      <circle class="star" cx="296" cy="58" r="0.9" style="animation-delay:-1.2s"/>
      <circle class="star" cx="372" cy="24" r="1.1" style="animation-delay:-2.8s"/>
      <circle class="star" cx="448" cy="82" r="1.3" style="animation-delay:-0.9s"/>
      <circle class="star" cx="516" cy="40" r="0.9" style="animation-delay:-3.9s"/>
      <circle class="star" cx="574" cy="118" r="1.1" style="animation-delay:-1.7s"/>
      <circle class="star" cx="632" cy="52" r="1.5" style="animation-delay:-2.5s"/>
      <circle class="star" cx="688" cy="150" r="0.9" style="animation-delay:-0.2s"/>
      <circle class="star" cx="724" cy="28" r="1.0" style="animation-delay:-3.1s"/>
      <circle class="star" cx="772" cy="96" r="1.2" style="animation-delay:-1.4s"/>
      <circle class="star" cx="808" cy="186" r="0.9" style="animation-delay:-2.2s"/>
      <circle class="star" cx="842" cy="44" r="1.1" style="animation-delay:-4.1s"/>
      <circle class="star" cx="952" cy="34" r="1.3" style="animation-delay:-0.7s"/>
      <circle class="star" cx="986" cy="128" r="0.9" style="animation-delay:-2.9s"/>
      <circle class="star" cx="1024" cy="186" r="1.2" style="animation-delay:-1.9s"/>
      <circle class="star" cx="1046" cy="52" r="0.9" style="animation-delay:-3.6s"/>
      <circle class="star" cx="1088" cy="152" r="1.4" style="animation-delay:-0.5s"/>
      <circle class="star" cx="1138" cy="206" r="0.9" style="animation-delay:-2.4s"/>
      <circle class="star" cx="1164" cy="36" r="1.1" style="animation-delay:-1.1s"/>
      <circle class="star" cx="1172" cy="118" r="1.0" style="animation-delay:-3.4s"/>
      <circle class="star" cx="640" cy="208" r="1.0" style="animation-delay:-1.6s"/>
      <circle class="star" cx="930" cy="212" r="0.9" style="animation-delay:-0.3s"/>
    </g>

    <!-- 月 -->
    <circle class="glow" cx="1098" cy="72" r="70" fill="url(#moonGlow)"/>
    <rect x="1040" y="20" width="120" height="120" fill="#fde9a8" mask="url(#crescent)"/>

    <!-- 水面 -->
    <rect y="250" width="1200" height="70" fill="url(#water)"/>
    <rect y="249.5" width="1200" height="1" fill="url(#horizon)"/>

    <!-- 波紋 -->
    <ellipse class="ripple warm" cx="880" cy="284" rx="150" ry="22"/>
    <ellipse class="ripple warm" cx="880" cy="284" rx="150" ry="22" style="animation-delay:-2s"/>
    <ellipse class="ripple warm" cx="880" cy="284" rx="150" ry="22" style="animation-delay:-4s"/>
    <ellipse class="ripple" cx="1090" cy="296" rx="90" ry="13" style="animation-delay:-1.2s"/>
    <ellipse class="ripple" cx="1090" cy="296" rx="90" ry="13" style="animation-delay:-4.2s"/>
    <ellipse class="ripple violet" cx="560" cy="298" rx="110" ry="14" style="animation-delay:-3s"/>
    <ellipse class="ripple violet" cx="560" cy="298" rx="110" ry="14" style="animation-delay:-0.3s"/>
    <ellipse class="ripple" cx="190" cy="294" rx="100" ry="14" style="animation-delay:-5s"/>
    <ellipse class="ripple" cx="190" cy="294" rx="100" ry="14" style="animation-delay:-2.2s"/>

    <!-- 線香花火 -->
    <ellipse class="reflection" cx="880" cy="272" rx="46" ry="7" fill="#ffb454" opacity="0.2"/>
    <path d="M880 0 L880 132 L878.5 150 L881 166" fill="none" stroke="#4a5378" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="glow" cx="880" cy="174" r="46" fill="url(#emberGlow)"/>
    <g transform="translate(880 174)">
      <path class="spark" pathLength="1" d="M0 0 L34 -20 M34 -20 L48 -36 M34 -20 L54 -16" style="animation-delay:-0.1s"/>
      <path class="spark" pathLength="1" d="M0 0 L-30 -24 M-30 -24 L-36 -44 M-30 -24 L-52 -26" style="animation-delay:-0.9s"/>
      <path class="spark" pathLength="1" d="M0 0 L40 14 M40 14 L60 8 M40 14 L54 30" style="animation-delay:-1.5s"/>
      <path class="spark" pathLength="1" d="M0 0 L-42 10 M-42 10 L-62 2 M-42 10 L-56 26" style="animation-delay:-2.1s"/>
      <path class="spark" pathLength="1" d="M0 0 L12 -42 M12 -42 L4 -60 M12 -42 L28 -56" style="animation-delay:-0.5s"/>
      <path class="spark" pathLength="1" d="M0 0 L-14 38 M-14 38 L-30 48 M-14 38 L-8 56" style="animation-delay:-1.8s"/>
      <path class="spark" pathLength="1" d="M0 0 L22 34 M22 34 L20 54 M22 34 L40 44" style="animation-delay:-1.2s"/>
      <path class="spark" pathLength="1" d="M0 0 L-52 -6 M-52 -6 L-70 -16" style="animation-delay:-2.4s"/>
    </g>
    <circle class="ember" cx="880" cy="174" r="6.5" fill="#ffc46b"/>
    <circle cx="880" cy="174" r="3" fill="#fff4d6"/>

    <!-- テキスト -->
    <text class="label" x="74" y="74">HELLO, I'M</text>
    <text class="name" x="68" y="164">maka</text>
    <text class="meta" x="74" y="200">@makamaika · Osaka, Japan</text>
    <text class="tag" x="74" y="238">セキュリティを「体験」に。ブラウザに、小さな遊びを。</text>
  </g>
</svg>
